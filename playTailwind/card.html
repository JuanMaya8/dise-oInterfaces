<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Tailwind</title>
  <!-- CDN de Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  
  <div class="flex items-center justify-center min-h-screen bg-gray-100">
  
  <div class="max-w-sm bg-white rounded-2xl border border-red-500 shadow-2xl overflow-hidden flex flex-col">
    
    
    <img 
      class="w-full h-48 object-cover" 
      src="https://static.vecteezy.com/system/resources/previews/001/882/528/non_2x/beautiful-landscape-pine-forest-with-mesmerizing-mountain-views-free-vector.jpg" 
      alt="Mountain Landscape"
    >
    
    
    <div class="p-4 flex flex-col">
      <!-- Título -->
      <h2 class="text-lg font-bold text-left text-gray-800">Red Heaven</h2>
      
      
      <p class="text-sm text-gray-500 mt-2">
        Lorem ipsum dolor sit amet, consectetur
      </p> 

      <p class="text-sm text-gray-500 ">
          adipisicing elit. Voluptatibus quia, nulla! 
      </p>
      
      <p class="text-sm text-gray-500 ">
        Maiores et perferendis eaque, exercitationem
      </p> 

      <p class="text-sm text-gray-500 ">  
         praesentium nihil.
      </p> 
     
      <div class="flex space-x-2 mt-4">
        <span class="px-3 py-1 text-xs font-semibold text-white bg-red-400 rounded-full">#tailwind</span>
        <span class="px-3 py-1 text-xs font-semibold text-white bg-red-400 rounded-full">#frontendeverything</span>
      </div>
    </div>
  </div>
</div>

  
</body>
</html>
